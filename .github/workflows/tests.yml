name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vpnadmin
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: vpnmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnadmin -d vpnmanager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://vpnadmin:ci-password@localhost:5432/vpnmanager_test
      API_KEY: test-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
